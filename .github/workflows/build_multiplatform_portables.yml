name: Build Official Matrix and Portables
run-name: Build ${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric binary version, for example 2.4.11.2"
        type: string
        required: true

permissions:
  contents: read

jobs:
  Validate_Version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate numeric version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "version must contain only three or four numeric components" >&2
            exit 1
          fi

  Build_v2rayA_Web:
    needs: Validate_Version
    uses: ./.github/workflows/_build_web.yml
    with:
      upload_archive: true

  Build_v2rayA_Binaries:
    needs: [Validate_Version, Build_v2rayA_Web]
    uses: ./.github/workflows/_build_binaries.yml
    with:
      version: ${{ inputs.version }}

  Build_Linux_Packages:
    needs: Build_v2rayA_Binaries
    uses: ./.github/workflows/_build_linux_packages.yml
    with:
      version: ${{ inputs.version }}

  Build_Windows_Installers:
    needs: Build_Linux_Packages
    uses: ./.github/workflows/_build_windows_installer.yml
    with:
      version: ${{ inputs.version }}

  Package_Release_Assets:
    needs:
      [
        Build_v2rayA_Web,
        Build_v2rayA_Binaries,
        Build_Linux_Packages,
        Build_Windows_Installers,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download official-matrix binaries
        uses: actions/download-artifact@v8
        with:
          pattern: v2raya_*
          path: build/downloads
          merge-multiple: true
      - name: Download official installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer_*
          path: build/installers
          merge-multiple: true
      - name: Download official Web archive
        uses: actions/download-artifact@v8
        with:
          name: web.tar.gz
          path: build/web-archive
      - name: Download official Web files
        uses: actions/download-artifact@v8
        with:
          name: web
          path: build/web
      - name: Build complete release asset set
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package-portables.sh \
            "$VERSION" \
            build/downloads \
            build/release \
            "$GITHUB_SHA"

          mkdir -p build/web-release
          (
            cd build/web
            zip -q -r -9 ../web-release/web.zip .
          )

          cp build/installers/installer_* build/release/
          cp build/web-archive/web.tar.gz build/release/
          cp build/web-release/web.zip build/release/

          for asset in build/release/installer_* \
            build/release/web.tar.gz build/release/web.zip; do
            sha256sum "$asset" | awk '{print $1}' >"$asset.sha256.txt"
          done

          asset_count=$(find build/release -maxdepth 1 -type f \
            ! -name '*.sha256.txt' | wc -l)
          checksum_count=$(find build/release -maxdepth 1 -type f \
            -name '*.sha256.txt' | wc -l)
          if [ "$asset_count" -ne 84 ] || [ "$checksum_count" -ne 84 ]; then
            echo "expected 84 assets and 84 checksums; found $asset_count assets and $checksum_count checksums" >&2
            exit 1
          fi
      - name: Upload complete release asset set
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ inputs.version }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
