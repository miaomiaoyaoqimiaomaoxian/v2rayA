syntax = "proto3";

package v2raya.proxy.anytls;
option go_package = "github.com/v2rayA/v2raya-core/hint/proxy/anytls";

message ClientConfig {
  // Server hostname or IP
  string address = 1;
  // Server port
  uint32 port = 2;
  // Authentication password
  string password = 3;
  // TLS SNI override (optional)
  string sni = 4;
  // Skip certificate verification.
  //
  // Upstream reserved this in favour of certificate pinning, but subscription
  // links in the wild carry "insecure=1", and airports serve a shared
  // certificate whose name does not match the SNI. Dropping it made every such
  // node fail with "certificate signed by unknown authority". Restored so those
  // links work; a supplied pin still takes precedence.
  bool allow_insecure = 5;
  // Minimum number of idle sessions to keep
  uint32 min_idle_sessions = 6;
  // Pinned peer certificate chain SHA256 hash. Accepts hex or base64.
  string pinned_peer_certificate_chain_sha256 = 7;
}
